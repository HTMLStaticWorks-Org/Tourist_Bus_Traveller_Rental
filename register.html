<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    const savedTheme = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', savedTheme);
    if (localStorage.getItem('rtl') === 'true') {
      document.documentElement.setAttribute('dir', 'rtl');
    }
  </script>
  <title>Create Account | Horizon Coach – Tourist Bus &amp; Traveller Rental</title>
  <meta name="description"
    content="Register for a Horizon Coach Customer Portal account to book tourist buses, tempo travellers, and manage group trips.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkbg: '#0B1120',
            cardbg1: '#111B2E',
            primary: '#0D9488',
            secondary: '#111B2E',
            accent: '#D4AF37',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Manrope', 'Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/custom.css">
  <style>
    .neon-focus:focus {
      border-color: #0D9488;
      box-shadow: 0 0 15px rgba(15, 118, 110, 0.4);
    }
  </style>
</head>

<body
  class="bg-[#0B1120] text-white min-h-screen flex items-center justify-center relative overflow-hidden pt-20 pb-8 md:py-8">

  <!-- Header Style Action Controls (Top Right) -->
  <div class="absolute top-4 right-4 z-50 flex items-center gap-3">
    <button id="theme-toggle" class="header-theme-switch" title="Toggle Theme">
      <span class="track-icons flex justify-between items-center text-xs select-none w-full">
        <i class="fa-regular fa-moon text-sky-400 text-xs opacity-75"></i>
        <i class="fa-regular fa-sun text-amber-400 text-xs opacity-75"></i>
      </span>
      <span id="header-theme-thumb"><i id="theme-icon" class="fa-regular fa-sun text-white"></i></span>
    </button>
    <button id="rtl-toggle"
      class="w-[38px] h-[38px] flex items-center justify-center rounded-full border border-white/20 hover:bg-white/10 text-gray-300 hover:text-white transition-colors bg-transparent"
      title="Toggle Layout Direction">
      <i id="rtl-icon" class="fa-solid fa-right-left text-sm"></i>
    </button>
  </div>

  <!-- Background Orbs -->
  <div class="bg-gradient-orb orb-primary -top-12 -left-12"></div>
  <div class="bg-gradient-orb orb-secondary -bottom-12 -right-12"></div>

  <!-- Glass Form Container -->
  <main class="w-full max-w-md px-6 relative z-10">
    <div class="glass-panel auth-card p-8 rounded-3xl space-y-5">

      <!-- Logo Header -->
      <div class="text-center space-y-2">
        <a class="brand-logo flex items-center justify-center gap-2 tracking-wider text-decoration-none"
          href="index.html">
          <i class="fa-solid fa-bus-simple text-[#D4AF37] text-xl"></i>
          <span>HORIZON<span class="text-[#0D9488]">COACH</span></span>
        </a>
        <p class="text-xs text-[#CBD5E1]">Create your Customer Travel Account (Demo)</p>
      </div>

      <!-- Registration Form -->
      <form id="registerForm" class="space-y-3.5" onsubmit="handleRegister(event)">
        <div>
          <label class="block text-[10px] uppercase tracking-widest text-[#CBD5E1] mb-1">Full Name</label>
          <input type="text" required placeholder="e.g. Aarav Patel"
            class="w-full px-4 py-2.5 rounded-xl bg-[#0B1120]/70 border border-white/20 text-white text-xs placeholder-gray-400 focus:outline-none neon-focus transition-all">
        </div>
        <div>
          <label class="block text-[10px] uppercase tracking-widest text-[#CBD5E1] mb-1">Email Address</label>
          <input type="email" required placeholder="name@example.com"
            class="w-full px-4 py-2.5 rounded-xl bg-[#0B1120]/70 border border-white/20 text-white text-xs placeholder-gray-400 focus:outline-none neon-focus transition-all">
        </div>
        <div>
          <label class="block text-[10px] uppercase tracking-widest text-[#CBD5E1] mb-1">Mobile Number</label>
          <input type="tel" required placeholder="+1 (800) 555-0199"
            class="w-full px-4 py-2.5 rounded-xl bg-[#0B1120]/70 border border-white/20 text-white text-xs placeholder-gray-400 focus:outline-none neon-focus transition-all">
        </div>
        <div>
          <label class="block text-[10px] uppercase tracking-widest text-[#CBD5E1] mb-1">Password</label>
          <input id="reg-password" type="password" required minlength="6" placeholder="Create password"
            class="w-full px-4 py-2.5 rounded-xl bg-[#0B1120]/70 border border-white/20 text-white text-xs placeholder-gray-400 focus:outline-none neon-focus transition-all">
        </div>
        <div>
          <label class="block text-[10px] uppercase tracking-widest text-[#CBD5E1] mb-1">Confirm Password</label>
          <input id="reg-confirm-password" type="password" required minlength="6" placeholder="Confirm password"
            class="w-full px-4 py-2.5 rounded-xl bg-[#0B1120]/70 border border-white/20 text-white text-xs placeholder-gray-400 focus:outline-none neon-focus transition-all">
        </div>
        <p id="regError" class="hidden text-xs text-amber-300"></p>

        <button type="submit"
          class="w-full py-3 rounded-xl bg-[#0D9488] hover:bg-[#0D9488]/90 transition-all font-semibold text-xs uppercase tracking-wider text-white mt-2">
          Create Account
        </button>
      </form>

      <!-- Social Media Sign Up -->
      <div class="space-y-4">
        <div class="flex items-center gap-2">
          <div class="h-[1px] bg-white/15 flex-1"></div>
          <span class="text-[9px] uppercase tracking-widest text-[#94A3B8]">Or sign up with</span>
          <div class="h-[1px] bg-white/15 flex-1"></div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <button type="button" onclick="location.href='dashboard.html';"
            class="social-login-btn google-btn py-2.5 rounded-xl border border-white/20 hover:border-[#D4AF37] transition-colors flex items-center justify-center gap-2 text-xs text-white">
            <i class="fa-brands fa-google text-red-500"></i> Google
          </button>
          <button type="button" onclick="location.href='dashboard.html';"
            class="social-login-btn apple-btn py-2.5 rounded-xl border border-white/20 hover:border-[#0D9488] transition-colors flex items-center justify-center gap-2 text-xs text-white">
            <i class="fa-brands fa-apple"></i> Apple
          </button>
        </div>
      </div>

      <!-- Login link -->
      <div class="text-center text-xs text-[#CBD5E1] pt-2">
        Already have an account? <a href="login.html"
          class="text-[#D4AF37] hover:underline text-decoration-none font-semibold">Sign In</a>
      </div>

    </div>
  </main>

  <button id="back-to-top" class="back-to-top" title="Back to top"><i class="fa-solid fa-arrow-up"></i></button>

  <script>
    function handleRegister(e) {
      e.preventDefault();
      const pw = document.getElementById('reg-password').value;
      const cpw = document.getElementById('reg-confirm-password').value;
      const err = document.getElementById('regError');
      if (pw !== cpw) {
        err.textContent = 'Passwords do not match. Please verify and try again.';
        err.classList.remove('hidden');
        return;
      }
      err.classList.add('hidden');
      location.href = 'dashboard.html';
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
